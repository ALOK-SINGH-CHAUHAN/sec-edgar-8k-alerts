services:
  - type: web
    name: sec-edgar-8k-alerts
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py web
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: SEC_USER_AGENT
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
